services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8005:8005"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /nf-entrada-totvs/api
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
