server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Redirect bare path (no trailing slash) to canonical form
    location = /nf-entrada-totvs {
        return 301 /nf-entrada-totvs/;
    }

    # Proxy API calls to the backend service (strip prefix)
    location /nf-entrada-totvs/api/ {
        proxy_pass http://backend:8005/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA — serve index.html for all routes under the prefix
    location /nf-entrada-totvs/ {
        try_files $uri $uri/ /nf-entrada-totvs/index.html;
    }
}
